<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Code history</title>
<style>
  :root {
    --bg: #f7f4ed;
    --surface: #fdfbf6;
    --surface-2: #f1ede2;
    --text: #1f1e1c;
    --muted: #6b675e;
    --muted-2: #a8a395;
    --border: #e3ddcd;
    --border-soft: #ece6d4;
    --accent: #c96442;
    --accent-soft: #f4dccd;
    --accent-line: #e8b69b;
    --code-bg: #efe9d8;
    --aux-bg: #f4efdf;
    --aux-text: #6f6a5d;
    --error-bg: #fbe6dc;
    --error-line: #c96442;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Söhne", system-ui, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre, kbd { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 13px; }
  pre { background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto;
    margin: 6px 0; border: 1px solid var(--border-soft); white-space: pre-wrap; word-break: break-word; }
  code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
  pre code { background: none; padding: 0; }
  button, input, select { font: inherit; color: var(--text); }
  button {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent-line); }
  input, select {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent-soft); outline-offset: -1px;
    border-color: var(--accent); }

  #topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(247,244,237,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; gap: 22px;
  }
  #topbar .brand { color: var(--text); font-weight: 600; letter-spacing: -0.01em; font-size: 15px; }
  #topbar nav { display: flex; gap: 16px; }
  #topbar nav a { color: var(--muted); padding: 4px 0; font-size: 14px; }
  #topbar nav a:hover { color: var(--text); text-decoration: none; }
  #topbar nav a.active { color: var(--text); border-bottom: 2px solid var(--accent); padding-bottom: 2px; }

  main { max-width: 920px; margin: 0 auto; padding: 28px 24px 80px; }

  /* index */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .filters input, .filters select { min-width: 130px; }
  .search-wrap { position: relative; flex: 1; min-width: 280px; display: flex; }
  .search-wrap input { width: 100%; padding-right: 32px; }
  .search-wrap .clear-search {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; padding: 4px 8px; color: var(--muted-2);
    font-size: 16px; line-height: 1; border-radius: 4px;
  }
  .search-wrap .clear-search:hover { background: var(--surface-2); color: var(--text); }
  .filters .reset-all { color: var(--muted); font-size: 13px; padding: 0 4px; cursor: pointer; }
  .filters .reset-all:hover { color: var(--accent); }

  .index-layout { display: grid; grid-template-columns: 1fr 160px; gap: 36px; align-items: start; }
  @media (max-width: 800px) { .index-layout { grid-template-columns: 1fr; } .month-jump { display: none; } }
  .month-jump { position: sticky; top: 80px;
    border-left: 1px solid var(--border); padding-left: 14px;
    max-height: calc(100vh - 100px); overflow-y: auto; }
  .month-jump .label { color: var(--muted-2); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 6px; }
  .month-jump .month { margin-bottom: 4px; }
  .month-jump .month-toggle {
    display: flex; align-items: center; gap: 6px; width: 100%;
    background: none; border: 0; padding: 4px 0; cursor: pointer;
    color: var(--muted); font-size: 13.5px; text-align: left;
  }
  .month-jump .month-toggle:hover { color: var(--accent); background: none; }
  .month-jump .month-toggle .chev { display: inline-block; width: 10px; color: var(--muted-2);
    transition: transform 0.15s; }
  .month-jump .month.open .month-toggle .chev { transform: rotate(90deg); }
  .month-jump .days { display: none; padding: 2px 0 6px 16px; }
  .month-jump .month.open .days { display: block; }
  .month-jump .days a { display: block; color: var(--muted); padding: 2px 0; font-size: 13px;
    font-variant-numeric: tabular-nums; }
  .month-jump .days a:hover { color: var(--accent); text-decoration: none; }

  .day-section { margin-bottom: 22px; scroll-margin-top: 80px; }
  .day-section h2 { font-size: 12.5px; color: var(--muted); margin: 22px 0 8px;
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  .day-section:first-of-type h2 { margin-top: 0; }
  .session-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 8px; display: block; color: inherit;
    transition: border-color 0.1s, transform 0.05s;
  }
  .session-card:hover { border-color: var(--accent-line); text-decoration: none; }
  .session-card:active { transform: translateY(1px); }
  .session-card .row1 { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  .session-card .name { font-weight: 600; }
  .session-card .branch { color: var(--muted); font-size: 13px; margin-left: 8px; font-weight: normal; }
  .session-card .repo { color: var(--muted-2); font-size: 12.5px; margin-left: 6px; font-weight: normal; }
  .session-card .time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums;
    flex-shrink: 0; }
  .session-card .prompt { color: var(--muted); margin-top: 6px; font-size: 14px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .session-card .meta { color: var(--muted-2); font-size: 12.5px; margin-top: 8px; display: flex; gap: 14px;
    font-variant-numeric: tabular-nums; }
  .session-card .match { color: var(--accent); font-size: 12.5px; margin-top: 6px; }

  /* session page */
  .back { color: var(--muted); margin-bottom: 16px; display: inline-block; font-size: 14px; }
  .back:hover { color: var(--accent); text-decoration: none; }
  .session-header {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 22px; margin-bottom: 28px;
  }
  .session-header .title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .session-header .title .repo { font-size: 19px; font-weight: 600; letter-spacing: -0.005em; }
  .session-header .title .branch { color: var(--muted); font-size: 14px; }
  .session-header .sid { display: inline-flex; gap: 8px; align-items: center; margin-top: 10px; }
  .session-header .sid .label { color: var(--muted); font-size: 12.5px; }
  .session-header .sid code { background: var(--code-bg); padding: 3px 8px; border-radius: 5px; font-size: 12.5px; }
  .session-header .sid .copy { padding: 3px 9px; font-size: 12px; }
  .session-header .stats { color: var(--muted); font-size: 13px;
    display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; align-items: center; }
  .session-header .stats b { color: var(--text); font-weight: 600; }
  .session-header .toggle { margin-left: auto; font-size: 13px; color: var(--muted);
    display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

  .evt { margin: 22px 0; }
  .evt .who { font-size: 11.5px; color: var(--muted-2); margin-bottom: 6px;
    display: flex; gap: 10px; align-items: baseline; text-transform: uppercase; letter-spacing: 0.05em; }
  .evt .who b { color: var(--muted); font-weight: 600; }
  .evt .who .ts { font-variant-numeric: tabular-nums; }
  .evt.user .body { background: var(--accent-soft); border-radius: 12px; padding: 14px 18px; }
  .evt.user .body .markdown p:first-child { margin-top: 0; }
  .evt.user .body .markdown p:last-child { margin-bottom: 0; }
  .evt.assistant .body { padding: 0 2px; }

  .aux {
    color: var(--aux-text); margin: 12px 0;
    border-left: 2px solid var(--border); padding: 0 0 0 14px;
  }
  .aux .aux-label { color: var(--muted); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 500; }
  .aux .aux-label .name { color: var(--accent); text-transform: none; letter-spacing: normal;
    font-weight: 600; font-size: 13px; }
  .aux pre { background: var(--aux-bg); border-color: var(--border-soft); font-size: 12.5px; }
  .aux .markdown { font-size: 14px; }
  .aux .markdown p { margin: 4px 0; }
  .aux.tool-result.error { border-left-color: var(--error-line); }
  .aux.tool-result.error pre { background: var(--error-bg); border-color: #f0c7b3; }

  .clamp { position: relative; }
  .clamp .clamped { max-height: 60lh; overflow: hidden; position: relative; }
  .clamp .clamped::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60px;
    background: linear-gradient(transparent, var(--bg)); pointer-events: none; }
  .clamp.expanded .clamped { max-height: none; }
  .clamp.expanded .clamped::after { display: none; }
  .clamp .show-all { color: var(--accent); cursor: pointer; background: none; border: 0;
    padding: 6px 0 0 0; font-size: 13px; }
  .clamp .show-all:hover { background: none; text-decoration: underline; border: 0; }

  .markdown p { margin: 8px 0; }
  .markdown ul, .markdown ol { margin: 8px 0; padding-left: 22px; }
  .markdown li { margin: 2px 0; }
  .markdown h1, .markdown h2, .markdown h3 { margin: 14px 0 8px; line-height: 1.3; letter-spacing: -0.005em; }
  .markdown h1 { font-size: 20px; font-weight: 600; }
  .markdown h2 { font-size: 17px; font-weight: 600; }
  .markdown h3 { font-size: 15px; font-weight: 600; }
  .markdown blockquote { border-left: 3px solid var(--border); padding-left: 10px;
    color: var(--muted); margin: 8px 0; }

  .internal-block { background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 8px 12px; margin: 16px 0; font-size: 12.5px; color: var(--muted); }
  .internal-block summary { cursor: pointer; color: var(--muted); }
  .internal-block .internal { padding: 1px 0; }
  .internal-block .kind { color: var(--accent); font-weight: 500; margin-right: 4px; }

  /* stats */
  .stats-totals { font-size: 16px; color: var(--muted); margin-bottom: 14px; }
  .stats-totals b { color: var(--text); font-weight: 600; }
  .stats-nav { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; margin-bottom: 26px;
    color: var(--muted); }
  .stats-nav a { color: var(--muted); }
  .stats-nav a:hover { color: var(--accent); text-decoration: none; }
  .stats h2 { font-size: 13px; color: var(--muted); margin: 28px 0 10px;
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
    scroll-margin-top: 80px; }
  .stats h2:first-of-type { margin-top: 0; }
  table.stats-table { width: 100%; border-collapse: collapse; margin-bottom: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table.stats-table th, table.stats-table td { padding: 9px 14px; border-bottom: 1px solid var(--border-soft);
    font-variant-numeric: tabular-nums; text-align: left; font-size: 14px; }
  table.stats-table th { background: var(--surface-2); color: var(--muted); font-weight: 500; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.04em; }
  table.stats-table td.num, table.stats-table th.num { text-align: right; }
  table.stats-table tr:last-child td { border-bottom: 0; }

  .empty { color: var(--muted); padding: 60px 20px; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header id="topbar">
  <a class="brand" href="?">claude history</a>
  <nav>
    <a id="nav-index" href="?">Sessions</a>
    <a id="nav-stats" href="?view=stats">Stats</a>
  </nav>
</header>
<main id="content"><div class="empty">Loading…</div></main>
<script>
// ---------- utilities ----------
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function pad2(n) { return String(n).padStart(2, "0"); }
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtTimeOfDay(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtBytes(n) { return (n||0).toLocaleString(); }
function fmtTokens(t) {
  if (!t) return "0";
  if (t >= 1e6) return (t/1e6).toFixed(2) + "M";
  if (t >= 1e3) return (t/1e3).toFixed(1) + "k";
  return String(t);
}
function fmtCost(c) { return c ? "$" + c.toFixed(c < 1 ? 3 : 2) : "$0"; }
function totalTokens(t) {
  if (!t) return 0;
  return (t.input_tokens||0) + (t.output_tokens||0) + (t.cache_read_tokens||0) + (t.cache_creation_tokens||0);
}
function localDayKey(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return iso.slice(0,10);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function localMonthKey(iso) { return localDayKey(iso).slice(0,7); }
function localWeekKey(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = tmp.getUTCDay() || 7;
  tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil(((tmp - yearStart) / 86400000 + 1) / 7);
  return `${tmp.getUTCFullYear()}-W${pad2(weekNo)}`;
}
function monthLabel(key) {
  const d = new Date(key + "-01T00:00:00");
  if (isNaN(d)) return key;
  return d.toLocaleString(undefined, { month: "long", year: "numeric" });
}

// ---------- markdown ----------
function renderMarkdown(src) {
  if (!src) return "";
  const lines = String(src).split(/\r?\n/);
  const out = [];
  let i = 0, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const inline = (t) => {
    t = esc(t);
    t = t.replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
    t = t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  };
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flushPara();
      const lang = line.slice(3).trim();
      const body = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { body.push(lines[i]); i++; }
      i++;
      out.push('<pre><code' + (lang?' class="lang-'+esc(lang)+'"':'') + '>' + esc(body.join("\n")) + "</code></pre>");
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushPara(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) {
      flushPara(); const items = [];
      while (i < lines.length) {
        const m = lines[i].match(/^\s*[-*]\s+(.*)$/);
        if (!m) break; items.push("<li>" + inline(m[1]) + "</li>"); i++;
      }
      out.push("<ul>" + items.join("") + "</ul>"); continue;
    }
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) {
      flushPara(); const items = [];
      while (i < lines.length) {
        const m = lines[i].match(/^\s*\d+\.\s+(.*)$/);
        if (!m) break; items.push("<li>" + inline(m[1]) + "</li>"); i++;
      }
      out.push("<ol>" + items.join("") + "</ol>"); continue;
    }
    if (line.trim() === "") { flushPara(); i++; continue; }
    para.push(line); i++;
  }
  flushPara();
  return out.join("\n");
}

// ---------- state ----------
const state = {
  sessions: [],
  searchResults: null,   // null = no active search
  filters: { search: "", branch: "" },
  showInternals: false,
};

// ---------- routing ----------
const contentEl = document.getElementById("content");
let lastRouteKey = "";
function route() {
  const key = location.pathname + location.search;
  if (key === lastRouteKey) return;
  lastRouteKey = key;
  const p = new URLSearchParams(location.search);
  const sPath = p.get("s");
  const view = p.get("view");
  if (sPath) {
    setActiveNav(null);
    renderSessionPage(sPath);
  } else if (view === "stats") {
    setActiveNav("stats");
    renderStatsPage();
  } else {
    setActiveNav("index");
    renderIndexPage();
  }
}
function setActiveNav(which) {
  document.getElementById("nav-index").classList.toggle("active", which === "index");
  document.getElementById("nav-stats").classList.toggle("active", which === "stats");
}
function navigate(query) {
  history.pushState(null, "", query || "?");
  window.scrollTo(0, 0);
  route();
}
window.addEventListener("popstate", route);
document.body.addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='?'], a.brand");
  if (!a) return;
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
  e.preventDefault();
  navigate(a.getAttribute("href"));
});

// ---------- index page ----------
function applyFilters(sessions) {
  const f = state.filters;
  const matches = state.searchResults ? new Map(state.searchResults.map(r => [r.path, r])) : null;
  return sessions.filter(s => {
    if (matches && !matches.has(s.path)) return false;
    if (f.branch && s.gitBranch !== f.branch) return false;
    if (s.tool !== "claude") return false;
    return true;
  });
}

function renderIndexPage() {
  const f = state.filters;
  const branches = new Set();
  for (const s of state.sessions) {
    if (s.gitBranch) branches.add(s.gitBranch);
  }
  const opt = (set, current, allLabel) =>
    `<option value="">${allLabel}</option>` +
    [...set].sort().map(v => `<option value="${esc(v)}"${v===current?" selected":""}>${esc(v)}</option>`).join("");

  contentEl.innerHTML = `
    <div class="filters">
      <div class="search-wrap">
        <input id="f-search" placeholder="Search transcripts…" value="${esc(f.search)}">
        <button class="clear-search" id="f-search-clear" type="button" title="Clear search"
          style="${f.search ? "" : "display:none"}">×</button>
      </div>
      <select id="f-branch">${opt(branches, f.branch, "All branches")}</select>
      <a class="reset-all" id="f-reset" href="#">Reset filters</a>
    </div>
    <div class="index-layout">
      <div id="sessions-area"></div>
      <aside class="month-jump"><div class="label">Jump to</div><div id="month-jump-list"></div></aside>
    </div>
  `;

  const search = document.getElementById("f-search");
  const clearBtn = document.getElementById("f-search-clear");
  let timer = null;
  const onSearchInput = () => {
    state.filters.search = search.value;
    clearBtn.style.display = search.value ? "" : "none";
    clearTimeout(timer);
    timer = setTimeout(runSearchAndRedraw, 250);
  };
  search.addEventListener("input", onSearchInput);
  clearBtn.addEventListener("click", () => {
    search.value = "";
    onSearchInput();
    search.focus();
  });

  document.getElementById("f-branch").addEventListener("change", (e) => {
    state.filters.branch = e.target.value;
    drawSessions();
  });

  document.getElementById("f-reset").addEventListener("click", (e) => {
    e.preventDefault();
    state.filters = { search: "", branch: "" };
    state.searchResults = null;
    renderIndexPage();
  });

  drawSessions();
}

async function runSearchAndRedraw() {
  const q = state.filters.search.trim();
  if (q.length < 2) {
    state.searchResults = null;
    drawSessions();
    return;
  }
  const r = await fetch("/api/search?q=" + encodeURIComponent(q) + "&limit=300");
  const data = await r.json();
  state.searchResults = data.results;
  drawSessions();
}

function drawSessions() {
  const area = document.getElementById("sessions-area");
  const jump = document.getElementById("month-jump-list");
  if (!area) return;
  const sessions = applyFilters(state.sessions);
  if (!sessions.length) {
    area.innerHTML = `<div class="empty">No sessions match.</div>`;
    jump.innerHTML = "";
    return;
  }
  const matches = state.searchResults ? new Map(state.searchResults.map(r => [r.path, r])) : null;
  const dayGroups = new Map();
  for (const s of sessions) {
    const key = localDayKey(s.startedAt || s.runStartedAt);
    if (!dayGroups.has(key)) dayGroups.set(key, []);
    dayGroups.get(key).push(s);
  }
  const dayKeys = [...dayGroups.keys()].sort().reverse();
  const seenMonths = new Set();
  area.innerHTML = dayKeys.map(day => {
    const monthKey = day.slice(0, 7);
    const monthAttr = seenMonths.has(monthKey) ? "" : ` data-first-of-month="${monthKey}"`;
    seenMonths.add(monthKey);
    const rows = dayGroups.get(day).map(s => {
      const match = matches && matches.get(s.path);
      const href = "?s=" + encodeURIComponent(s.path);
      const title = s.name || s.firstPrompt || "(untitled)";
      return `<a class="session-card" href="${href}">
        <div class="row1">
          <div><span class="name">${esc(title)}</span><span class="branch">${esc(s.gitBranch || "")}</span><span class="repo">${esc(s.repo || "")}</span></div>
          <div class="time">${esc(fmtTimeOfDay(s.startedAt || s.runStartedAt))}</div>
        </div>
        ${s.name && s.firstPrompt ? `<div class="prompt">${esc(s.firstPrompt)}</div>` : ""}
        <div class="meta">
          <span>${s.messages} msgs</span>
          <span>${fmtTokens(totalTokens(s.tokens))} tok</span>
          <span>${fmtCost(s.cost)}</span>
        </div>
        ${match ? `<div class="match">${match.matchCount} match${match.matchCount===1?"":"es"}</div>` : ""}
      </a>`;
    }).join("");
    return `<section class="day-section" id="day-${day}"${monthAttr}>
      <h2>${esc(dayLabel(day))} · ${dayGroups.get(day).length}</h2>
      ${rows}
    </section>`;
  }).join("");
  const monthsToDays = new Map();
  for (const day of dayKeys) {
    const m = day.slice(0, 7);
    if (!monthsToDays.has(m)) monthsToDays.set(m, []);
    monthsToDays.get(m).push(day);
  }
  const monthEntries = [...monthsToDays.entries()];
  const latestMonth = monthEntries[0]?.[0];
  jump.innerHTML = monthEntries.map(([m, days]) => `
    <div class="month${m === latestMonth ? " open" : ""}" data-month="${m}">
      <button class="month-toggle" type="button">
        <span class="chev">▸</span>
        <span>${esc(monthLabel(m))}</span>
        <span class="count" style="margin-left:auto;color:var(--muted-2);font-size:12px">${days.length}</span>
      </button>
      <div class="days">
        ${days.map(d => `<a href="#day-${d}">${esc(dayJumpLabel(d))}</a>`).join("")}
      </div>
    </div>`).join("");
  jump.querySelectorAll(".month-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      btn.parentElement.classList.toggle("open");
    });
  });
}

function dayJumpLabel(key) {
  const d = new Date(key + "T00:00:00");
  if (isNaN(d)) return key;
  return d.toLocaleString(undefined, { weekday: "short", day: "numeric" });
}

function dayLabel(key) {
  const d = new Date(key + "T00:00:00");
  if (isNaN(d)) return key;
  return d.toLocaleString(undefined, { weekday: "short", month: "long", day: "numeric" });
}

// ---------- session page ----------
async function renderSessionPage(path) {
  const session = state.sessions.find(x => x.path === path);
  contentEl.innerHTML = `
    <a class="back" href="?">← All sessions</a>
    <div id="session-header"></div>
    <div id="transcript"><div class="empty">Loading…</div></div>
  `;
  renderSessionHeader(session, path);
  const r = await fetch("/api/session?path=" + encodeURIComponent(path));
  if (!r.ok) {
    document.getElementById("transcript").innerHTML = `<div class="empty">Failed to load session.</div>`;
    return;
  }
  const data = await r.json();
  state.currentEvents = data.events;
  drawTranscript();
}

function renderSessionHeader(s, path) {
  const head = document.getElementById("session-header");
  if (!s) {
    head.innerHTML = `<div class="session-header"><div class="title"><div class="repo">unknown session</div></div></div>`;
    return;
  }
  const total = totalTokens(s.tokens);
  head.innerHTML = `
    <div class="session-header">
      <div class="title">
        <div class="repo">${esc(s.name || s.firstPrompt?.slice(0, 80) || "(untitled)")}</div>
        <div class="branch">${esc(s.gitBranch || "")} · ${esc(s.repo || "")}</div>
      </div>
      <div class="sid">
        <span class="label">id</span>
        <code>${esc(s.sessionId || "")}</code>
        <button class="copy" data-copy="${esc(s.sessionId || "")}">copy</button>
      </div>
      <div class="stats">
        <span>${esc(fmtTime(s.startedAt))} → ${esc(fmtTime(s.endedAt))}</span>
        <span><b>${s.messages}</b> msgs</span>
        <span><b>${fmtTokens(total)}</b> tokens</span>
        <span><b>${fmtCost(s.cost)}</b></span>
        <span>${(s.models||[]).map(esc).join(", ")}</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-internals" ${state.showInternals?"checked":""}> show internals
        </label>
      </div>
    </div>
  `;
  document.getElementById("toggle-internals").addEventListener("change", (e) => {
    state.showInternals = e.target.checked;
    drawTranscript();
  });
  head.querySelectorAll("button.copy").forEach(btn => {
    btn.addEventListener("click", async () => {
      const value = btn.dataset.copy;
      if (!value) return;
      try { await navigator.clipboard.writeText(value); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = value; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } finally { ta.remove(); }
      }
      const prev = btn.textContent; btn.textContent = "copied";
      setTimeout(() => { btn.textContent = prev; }, 1000);
    });
  });
}

const INTERNAL_TYPES = new Set([
  "system", "summary", "permission-mode", "skill_listing", "deferred_tools_delta",
  "task_reminder", "last-prompt", "file-history-snapshot", "edited_text_file",
  "attachment", "__parse_error",
]);

function drawTranscript() {
  const tEl = document.getElementById("transcript");
  if (!tEl) return;
  const events = state.currentEvents || [];
  const parts = [];
  let pending = [];
  const flush = () => {
    if (!pending.length) return;
    if (state.showInternals) {
      parts.push(`<details class="internal-block" open><summary>${pending.length} internal event${pending.length===1?"":"s"}</summary>` +
        pending.map(e => `<div class="internal"><span class="kind">${esc(e.type||"?")}</span>${esc(describeInternal(e))}</div>`).join("") +
        `</details>`);
    }
    pending = [];
  };
  for (const e of events) {
    const t = e.type;
    if (t === "user") { flush(); parts.push(renderUser(e)); }
    else if (t === "assistant") { flush(); parts.push(renderAssistant(e)); }
    else if (INTERNAL_TYPES.has(t)) { pending.push(e); }
    else { pending.push(e); }
  }
  flush();
  tEl.innerHTML = parts.join("\n") || `<div class="empty">Empty session.</div>`;
  hookClampButtons(tEl);
}

function describeInternal(e) {
  if (e.type === "attachment") return e.attachment?.hookName || e.attachment?.type || "";
  if (e.type === "summary") return (e.summary || "").slice(0, 200);
  if (e.type === "permission-mode") return e.permissionMode || "";
  if (e.type === "edited_text_file") return e.filePath || "";
  if (e.type === "__parse_error") return "parse error";
  return "";
}

function renderUser(e) {
  const ts = fmtTimeOfDay(e.timestamp);
  const content = e.message?.content;
  const blocks = [];
  if (typeof content === "string") {
    blocks.push(`<div class="markdown">${renderMarkdown(content)}</div>`);
  } else if (Array.isArray(content)) {
    for (const b of content) {
      if (b.type === "text") {
        blocks.push(`<div class="markdown">${renderMarkdown(b.text || "")}</div>`);
      } else if (b.type === "tool_result") {
        blocks.push(renderToolResult(b));
      }
    }
  }
  // Tool results from a previous assistant turn arrive packaged as a "user" event but
  // visually they belong to the assistant flow — only render a User bubble when there
  // is real user-authored text content.
  const hasUserText = (typeof content === "string" && content.trim())
    || (Array.isArray(content) && content.some(b => b.type === "text" && b.text?.trim()));
  if (hasUserText) {
    return `<div class="evt user"><div class="who"><b>You</b><span class="ts">${esc(ts)}</span></div>
      <div class="body">${blocks.filter((_, i) => Array.isArray(content) ? content[i]?.type !== "tool_result" : true).join("")}</div></div>`;
  }
  return `<div class="evt assistant-aux"><div class="body">${blocks.join("")}</div></div>`;
}

function renderAssistant(e) {
  const ts = fmtTimeOfDay(e.timestamp);
  const msg = e.message || {};
  const model = msg.model || "";
  const blocks = [];
  for (const b of msg.content || []) {
    if (b.type === "text") {
      blocks.push(`<div class="markdown">${renderMarkdown(b.text || "")}</div>`);
    } else if (b.type === "thinking") {
      const text = (b.thinking || "").trim();
      if (text) blocks.push(`<div class="aux thinking">
        <div class="aux-label">thinking</div>
        ${clampWrap(`<div class="markdown">${renderMarkdown(text)}</div>`, text)}
      </div>`);
    } else if (b.type === "tool_use") {
      blocks.push(renderToolUse(b));
    }
  }
  return `<div class="evt assistant"><div class="who"><b>Claude</b><span>${esc(model)}</span><span class="ts">${esc(ts)}</span></div>
    <div class="body">${blocks.join("")}</div></div>`;
}

function renderToolUse(b) {
  const input = JSON.stringify(b.input || {}, null, 2);
  return `<div class="aux tool-use">
    <div class="aux-label">→ <span class="name">${esc(b.name)}</span></div>
    ${clampWrap(`<pre><code>${esc(input)}</code></pre>`, input)}
  </div>`;
}

function renderToolResult(b) {
  let text = "";
  if (typeof b.content === "string") text = b.content;
  else if (Array.isArray(b.content)) text = b.content.map(x => x.text || "").join("\n");
  const cls = b.is_error ? "aux tool-result error" : "aux tool-result";
  return `<div class="${cls}">
    <div class="aux-label">← <span class="name">result${b.is_error?" (error)":""}</span></div>
    ${clampWrap(`<pre><code>${esc(text)}</code></pre>`, text)}
  </div>`;
}

const CLAMP_LINES = 60;
function clampWrap(html, rawText) {
  const lineCount = String(rawText || "").split(/\r?\n/).length;
  if (lineCount <= CLAMP_LINES) return html;
  return `<div class="clamp" data-lines="${lineCount}">
    <div class="clamped">${html}</div>
    <button class="show-all" type="button">Show all ${lineCount} lines</button>
  </div>`;
}

function hookClampButtons(root) {
  root.querySelectorAll(".clamp .show-all").forEach(btn => {
    btn.addEventListener("click", () => {
      btn.parentElement.classList.add("expanded");
      btn.remove();
    });
  });
}

// ---------- stats page ----------
function renderStatsPage() {
  const ss = state.sessions;
  let totals = { sessions: 0, events: 0, tokens: 0, cost: 0 };
  const byDay = {}, byWeek = {}, byMonth = {}, byRepo = {}, byModel = {};
  const bump = (bucket, key, label, t, cost) => {
    bucket[key] = bucket[key] || { [label]: key, sessions: 0, tokens: 0, cost: 0 };
    bucket[key].sessions += 1; bucket[key].tokens += t; bucket[key].cost += cost;
  };
  for (const s of ss) {
    if (s.tool !== "claude") continue;
    totals.sessions += 1; totals.events += s.events || 0;
    const t = totalTokens(s.tokens); totals.tokens += t;
    const cost = s.cost || 0; totals.cost += cost;
    const iso = s.startedAt || s.runStartedAt;
    bump(byDay,   localDayKey(iso),   "day",   t, cost);
    bump(byWeek,  localWeekKey(iso),  "week",  t, cost);
    bump(byMonth, localMonthKey(iso), "month", t, cost);
    bump(byRepo,  s.repo || "(none)", "repo",  t, cost);
    for (const m of s.models || []) bump(byModel, m, "model", t, cost);
  }
  const table = (rows, cols) =>
    `<table class="stats-table"><thead><tr>${cols.map(c => `<th class="${c.num?"num":""}">${c.label}</th>`).join("")}</tr></thead>
     <tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.num?"num":""}">${c.fmt ? c.fmt(r[c.key]) : esc(r[c.key] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  const sortDesc = (key) => (a, b) => String(b[key] ?? "").localeCompare(String(a[key] ?? ""));
  const sortByCost = (a, b) => b.cost - a.cost;
  const cols = (k) => [
    { key: k, label: k[0].toUpperCase()+k.slice(1) },
    { key: "sessions", label: "Sessions", num: true, fmt: fmtBytes },
    { key: "tokens", label: "Tokens", num: true, fmt: fmtTokens },
    { key: "cost", label: "Cost", num: true, fmt: fmtCost },
  ];
  contentEl.innerHTML = `
    <div class="stats">
      <div class="stats-totals">
        <b>${totals.sessions}</b> sessions · <b>${fmtBytes(totals.events)}</b> events ·
        <b>${fmtTokens(totals.tokens)}</b> tokens · <b>${fmtCost(totals.cost)}</b>
      </div>
      <div class="stats-nav">
        Jump to:
        <a href="#stats-month">month</a>
        <a href="#stats-week">week</a>
        <a href="#stats-day">day</a>
        <a href="#stats-repo">repo</a>
        <a href="#stats-model">model</a>
      </div>
      <h2 id="stats-month">By month</h2> ${table(Object.values(byMonth).sort(sortDesc("month")), cols("month"))}
      <h2 id="stats-week">By week</h2>   ${table(Object.values(byWeek).sort(sortDesc("week")),   cols("week"))}
      <h2 id="stats-day">By day</h2>     ${table(Object.values(byDay).sort(sortDesc("day")),     cols("day"))}
      <h2 id="stats-repo">By repo</h2>   ${table(Object.values(byRepo).sort(sortByCost),         cols("repo"))}
      <h2 id="stats-model">By model</h2> ${table(Object.values(byModel).sort(sortByCost),        cols("model"))}
    </div>
  `;
}

// ---------- bootstrap ----------
async function bootstrap() {
  const r = await fetch("/api/sessions");
  state.sessions = await r.json();
  route();
}
bootstrap().catch(err => {
  contentEl.innerHTML = `<div class="empty">Failed to load: ${esc(err.message)}</div>`;
});
</script>
