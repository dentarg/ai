<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent session history</title>
<style>
  :root {
    --bg: #f7f4ed;
    --surface: #fdfbf6;
    --surface-2: #f1ede2;
    --text: #1f1e1c;
    --muted: #6b675e;
    --muted-2: #a8a395;
    --border: #e3ddcd;
    --border-soft: #ece6d4;
    --accent: #c96442;
    --accent-soft: #f4dccd;
    --accent-line: #e8b69b;
    --code-bg: #efe9d8;
    --aux-bg: #f4efdf;
    --aux-text: #6f6a5d;
    --error-bg: #fbe6dc;
    --error-line: #c96442;
    --error-border: #f0c7b3;
    --topbar-bg: rgba(247,244,237,0.92);
    --shadow: rgba(0,0,0,0.08);
    /* agent distinction (Codex). Claude reuses --accent / --accent-soft. */
    --agent-codex-bg: #e1ecf8;
    --agent-codex-fg: #356aa8;
    --agent-codex-line: #6f9fd8;
  }
  /* Dark palette. An inline <head> script resolves the effective theme
     (stored choice, else the OS preference) and sets data-theme before
     first paint, so only this one block is needed. */
  :root[data-theme="dark"] {
    --bg: #1a1917;
    --surface: #242220;
    --surface-2: #2c2a27;
    --text: #ece8e0;
    --muted: #a8a295;
    --muted-2: #7c766b;
    --border: #38352f;
    --border-soft: #302d28;
    --accent: #e0795a;
    --accent-soft: #3a2a22;
    --accent-line: #8a4a35;
    --code-bg: #2a2724;
    --aux-bg: #262320;
    --aux-text: #9a948a;
    --error-bg: #3a221c;
    --error-line: #e0795a;
    --error-border: #5a3328;
    --topbar-bg: rgba(26,25,23,0.92);
    --shadow: rgba(0,0,0,0.45);
    --agent-codex-bg: #20303f;
    --agent-codex-fg: #7fb0e0;
    --agent-codex-line: #4a6f96;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Söhne", system-ui, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre, kbd { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 13px; }
  pre { background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto;
    margin: 6px 0; border: 1px solid var(--border-soft); white-space: pre-wrap; word-break: break-word; }
  code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
  pre code { background: none; padding: 0; }
  button, input, select { font: inherit; color: var(--text); }
  button {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent-line); }
  input, select {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent-soft); outline-offset: -1px;
    border-color: var(--accent); }

  #topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--topbar-bg); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; gap: 22px;
  }
  #topbar .brand { color: var(--text); font-weight: 600; letter-spacing: -0.01em; font-size: 15px; }
  #topbar nav { display: flex; gap: 16px; }
  #topbar nav a { color: var(--muted); padding: 4px 0; font-size: 14px; }
  #topbar nav a:hover { color: var(--text); text-decoration: none; }
  #topbar nav a.active { color: var(--text); border-bottom: 2px solid var(--accent); padding-bottom: 2px; }
  #topbar .theme-toggle { margin-left: auto; background: none; border: 1px solid var(--border);
    color: var(--muted); width: 30px; height: 30px; padding: 0; border-radius: 7px;
    font-size: 15px; line-height: 1; display: inline-flex; align-items: center;
    justify-content: center; }
  #topbar .theme-toggle:hover { color: var(--accent); border-color: var(--accent-line);
    background: var(--surface); }

  main { max-width: 920px; margin: 0 auto; padding: 28px 24px 80px; }

  /* index */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .filters input, .filters select { min-width: 130px; }
  .search-wrap { position: relative; flex: 1; min-width: 280px; display: flex; }
  .search-wrap input { width: 100%; padding-right: 32px; }
  .search-wrap .clear-search {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; padding: 4px 8px; color: var(--muted-2);
    font-size: 16px; line-height: 1; border-radius: 4px;
  }
  .search-wrap .clear-search:hover { background: var(--surface-2); color: var(--text); }
  .filters .reset-all { color: var(--muted); font-size: 13px; padding: 0 4px; cursor: pointer; }
  .filters .reset-all:hover { color: var(--accent); }

  .index-layout { display: grid; grid-template-columns: 1fr 160px; gap: 36px; align-items: start; }
  @media (max-width: 800px) { .index-layout { grid-template-columns: 1fr; } .month-jump { display: none; } }
  .month-jump { position: sticky; top: 80px;
    border-left: 1px solid var(--border); padding-left: 14px;
    max-height: calc(100vh - 100px); overflow-y: auto; }
  .month-jump .label { color: var(--muted-2); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 6px; }
  .month-jump .month { margin-bottom: 4px; }
  .month-jump .month-toggle {
    display: flex; align-items: center; gap: 6px; width: 100%;
    background: none; border: 0; padding: 4px 0; cursor: pointer;
    color: var(--muted); font-size: 13.5px; text-align: left;
  }
  .month-jump .month-toggle:hover { color: var(--accent); background: none; }
  .month-jump .month-toggle .chev { display: inline-block; width: 10px; color: var(--muted-2);
    transition: transform 0.15s; }
  .month-jump .month.open .month-toggle .chev { transform: rotate(90deg); }
  .month-jump .days { display: none; padding: 2px 0 6px 16px; }
  .month-jump .month.open .days { display: block; }
  .month-jump .days a { display: block; color: var(--muted); padding: 2px 0; font-size: 13px;
    font-variant-numeric: tabular-nums; }
  .month-jump .days a:hover { color: var(--accent); text-decoration: none; }

  .day-section { margin-bottom: 22px; scroll-margin-top: 80px; }
  .day-section h2 { font-size: 12.5px; color: var(--muted); margin: 22px 0 8px;
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  .day-section:first-of-type h2 { margin-top: 0; }
  .session-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 8px; display: block; color: inherit;
    transition: border-color 0.1s, transform 0.05s;
  }
  .session-card:hover { border-color: var(--accent-line); text-decoration: none; }
  .session-card:active { transform: translateY(1px); }
  .session-card .row1 { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  .session-card .name { font-weight: 600; }
  .session-card .branch { color: var(--muted); font-size: 13px; margin-left: 8px; font-weight: normal; }
  .session-card .repo { color: var(--muted-2); font-size: 12.5px; margin-left: 6px; font-weight: normal; }
  .session-card .time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums;
    flex-shrink: 0; }
  .session-card .time .arrow { color: var(--muted-2); margin: 0 1px; }
  .session-card .prompt { color: var(--muted); margin-top: 6px; font-size: 14px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .session-card .meta { color: var(--muted-2); font-size: 12.5px; margin-top: 8px; display: flex; gap: 14px;
    font-variant-numeric: tabular-nums; }
  .session-card .match { color: var(--accent); font-size: 12.5px; margin-top: 6px; }

  /* agent distinction: coral = Claude, blue = Codex */
  .agent-badge { display: inline-block; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 7px;
    border-radius: 999px; vertical-align: middle; }
  .agent-claude { background: var(--accent-soft); color: var(--accent); }
  .agent-codex  { background: var(--agent-codex-bg); color: var(--agent-codex-fg); }
  .session-card { border-left: 3px solid var(--border); }
  .session-card.claude { border-left-color: var(--accent-line); }
  .session-card.codex  { border-left-color: var(--agent-codex-line); }

  /* session page */
  .back { color: var(--muted); margin-bottom: 16px; display: inline-block; font-size: 14px; }
  .back:hover { color: var(--accent); text-decoration: none; }
  .session-header {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 22px; margin-bottom: 28px;
  }
  .session-header .title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .session-header .title .repo { font-size: 19px; font-weight: 600; letter-spacing: -0.005em; }
  .session-header .title .branch { color: var(--muted); font-size: 14px; }
  .session-header .sid { display: inline-flex; gap: 8px; align-items: center; margin-top: 10px; }
  .session-header .sid .label { color: var(--muted); font-size: 12.5px; }
  .session-header .sid code { background: var(--code-bg); padding: 3px 8px; border-radius: 5px; font-size: 12.5px; }
  .session-header .sid .copy { padding: 3px 9px; font-size: 12px; }
  .session-header .stats { color: var(--muted); font-size: 13px;
    display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; align-items: center; }
  .session-header .stats b { color: var(--text); font-weight: 600; }
  .session-header .toggle { font-size: 13px; color: var(--muted);
    display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .session-header .stats-controls { display: flex; gap: 16px; align-items: center;
    justify-content: flex-end; flex-wrap: wrap; margin-top: 10px; }
  .session-header .actions { display: inline-flex; gap: 8px; }
  .session-header .actions button { padding: 4px 10px; font-size: 12.5px; }

  .evt { margin: 22px 0; }
  .evt .who { font-size: 11.5px; color: var(--muted-2); margin-bottom: 6px;
    display: flex; gap: 10px; align-items: baseline; text-transform: uppercase; letter-spacing: 0.05em; }
  .evt .who b { color: var(--muted); font-weight: 600; }
  .evt .who .ts { font-variant-numeric: tabular-nums; }
  .evt.user .body { background: var(--accent-soft); border-radius: 12px; padding: 14px 18px; }
  .evt.user .body .markdown p:first-child { margin-top: 0; }
  .evt.user .body .markdown p:last-child { margin-bottom: 0; }
  .evt.assistant .body { padding: 0 2px; }

  .aux {
    color: var(--aux-text); margin: 12px 0;
    border-left: 2px solid var(--border); padding: 0 0 0 14px;
  }
  .aux .aux-label { color: var(--muted); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 500; }
  .aux .aux-label .name { color: var(--accent); text-transform: none; letter-spacing: normal;
    font-weight: 600; font-size: 13px; }
  .aux pre { background: var(--aux-bg); border-color: var(--border-soft); font-size: 12.5px; }
  .aux .markdown { font-size: 14px; }
  .aux .markdown p { margin: 4px 0; }
  .aux.tool-result.error { border-left-color: var(--error-line); }
  .aux.tool-result.error pre { background: var(--error-bg); border-color: var(--error-border); }

  .clamp { position: relative; }
  .clamp .clamped { max-height: 60lh; overflow: hidden; position: relative; }
  .clamp .clamped::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60px;
    background: linear-gradient(transparent, var(--bg)); pointer-events: none; }
  .clamp.expanded .clamped { max-height: none; }
  .clamp.expanded .clamped::after { display: none; }
  .clamp .show-all { color: var(--accent); cursor: pointer; background: none; border: 0;
    padding: 6px 0 0 0; font-size: 13px; }
  .clamp .show-all:hover { background: none; text-decoration: underline; border: 0; }

  .markdown p { margin: 8px 0; }
  .markdown ul, .markdown ol { margin: 8px 0; padding-left: 22px; }
  .markdown li { margin: 2px 0; }
  .markdown h1, .markdown h2, .markdown h3 { margin: 14px 0 8px; line-height: 1.3; letter-spacing: -0.005em; }
  .markdown h1 { font-size: 20px; font-weight: 600; }
  .markdown h2 { font-size: 17px; font-weight: 600; }
  .markdown h3 { font-size: 15px; font-weight: 600; }
  .markdown blockquote { border-left: 3px solid var(--border); padding-left: 10px;
    color: var(--muted); margin: 8px 0; }
  .markdown table.md-table { border-collapse: collapse; margin: 10px 0; font-size: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    display: block; max-width: 100%; overflow-x: auto; }
  .markdown table.md-table th, .markdown table.md-table td {
    padding: 6px 12px; border-bottom: 1px solid var(--border-soft); text-align: left;
    vertical-align: top; }
  .markdown table.md-table th { background: var(--surface-2); color: var(--muted);
    font-weight: 500; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .markdown table.md-table tr:last-child td { border-bottom: 0; }

  .evt { scroll-margin-top: 80px; }
  .evt .who .anchor { color: var(--muted-2);
    font-size: 12px; padding: 0 4px; }
  .evt .who .anchor.first { margin-left: auto; }
  .evt .who .copy-md { color: var(--muted-2);
    background: none; border: 0; cursor: pointer; font-size: 11px; padding: 0 4px;
    text-transform: uppercase; letter-spacing: 0.05em; }
  .evt .who .anchor:hover { color: var(--accent); text-decoration: none; }
  .evt .who .copy-md:hover { color: var(--accent); background: none; }
  .evt:target .body, .evt:target .who { background: var(--accent-soft); border-radius: 6px; }
  .evt .who { width: 100%; }

  .internal-block { background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 8px 12px; margin: 16px 0; font-size: 12.5px; color: var(--muted); }
  .internal-block summary { cursor: pointer; color: var(--muted); }
  .internal-block .internal { padding: 1px 0; }
  .internal-block .kind { color: var(--accent); font-weight: 500; margin-right: 4px; }

  /* stats */
  .stats-totals { font-size: 16px; color: var(--muted); margin-bottom: 14px; }
  .stats-totals b { color: var(--text); font-weight: 600; }
  .stats-nav { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; margin-bottom: 26px;
    color: var(--muted); }
  .stats-nav a { color: var(--muted); }
  .stats-nav a:hover { color: var(--accent); text-decoration: none; }
  .stats h2 { font-size: 13px; color: var(--muted); margin: 28px 0 10px;
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
    scroll-margin-top: 80px; }
  .stats h2:first-of-type { margin-top: 0; }
  table.stats-table { width: 100%; border-collapse: collapse; margin-bottom: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table.stats-table th, table.stats-table td { padding: 9px 14px; border-bottom: 1px solid var(--border-soft);
    font-variant-numeric: tabular-nums; text-align: left; font-size: 14px; }
  table.stats-table th { background: var(--surface-2); color: var(--muted); font-weight: 500; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.04em; }
  table.stats-table td.num, table.stats-table th.num { text-align: right; }
  table.stats-table tr:last-child td { border-bottom: 0; }

  .stats-chart { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 22px; margin-bottom: 26px; }
  .stats-chart-head { display: flex; align-items: baseline; justify-content: space-between;
    gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .stats-chart-head h2 { margin: 0; font-size: 13px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  .range-tabs { display: inline-flex; gap: 6px; }
  .range-tabs button { padding: 4px 10px; font-size: 12.5px; }
  .range-tabs button.active { background: var(--accent-soft); border-color: var(--accent-line);
    color: var(--text); }
  .stats-chart svg { display: block; width: 100%; height: auto; }
  .chart-axis { fill: var(--muted-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart-grid { stroke: var(--border-soft); stroke-width: 1; }
  .chart-baseline { stroke: var(--border); stroke-width: 1; }
  .chart-line { fill: none; stroke-width: 1.5; }
  .chart-bar { transition: opacity 0.1s; }
  .chart-hit { fill: transparent; cursor: crosshair; }
  .chart-hit.active { fill: var(--accent-soft); fill-opacity: 0.35; }
  .chart-wrap { position: relative; }
  .chart-tooltip { position: absolute; pointer-events: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 12.5px; box-shadow: 0 4px 12px var(--shadow);
    min-width: 200px; max-width: 280px; z-index: 5;
    opacity: 0; transition: opacity 0.08s; }
  .chart-tooltip.visible { opacity: 1; }
  .chart-tooltip .tt-date { font-weight: 600; margin-bottom: 5px; color: var(--text); }
  .chart-tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px;
    font-variant-numeric: tabular-nums; padding: 1px 0; }
  .chart-tooltip .tt-row .swatch { display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .chart-tooltip .tt-row .label { color: var(--text); }
  .chart-tooltip .tt-row .val { color: var(--muted); }
  .chart-tooltip .tt-total { margin-top: 5px; padding-top: 5px;
    border-top: 1px solid var(--border-soft); display: flex; justify-content: space-between;
    font-variant-numeric: tabular-nums; color: var(--text); }
  .chart-tooltip .tt-empty { color: var(--muted-2); font-style: italic; }
  .legend-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px 22px; margin-top: 16px; font-size: 13px; }
  .legend-item { display: flex; flex-direction: column; gap: 2px; }
  .legend-item .head { display: flex; align-items: center; gap: 8px; color: var(--text);
    font-weight: 500; }
  .legend-item .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block;
    flex-shrink: 0; }
  .legend-item .pct { color: var(--muted); font-size: 12.5px; font-weight: normal; }
  .legend-item .nums { color: var(--muted); font-size: 12.5px;
    font-variant-numeric: tabular-nums; padding-left: 18px; }

  .empty { color: var(--muted); padding: 60px 20px; text-align: center; }
  .hidden { display: none !important; }
</style>
<script>
  // Resolve the theme (stored choice, else OS preference) and set it before
  // first paint to avoid a flash of the wrong theme.
  (function () {
    var stored = null;
    try { stored = localStorage.getItem("theme"); } catch (e) {}
    var dark = stored
      ? stored === "dark"
      : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
</head>
<body>
<header id="topbar">
  <a class="brand" href="?">agent history</a>
  <nav>
    <a id="nav-index" href="?">Sessions</a>
    <a id="nav-stats" href="?view=stats">Stats</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
</header>
<main id="content"><div class="empty">Loading…</div></main>
<script>
// ---------- utilities ----------
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function pad2(n) { return String(n).padStart(2, "0"); }
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtTimeOfDay(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtShortDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString(undefined, { month: "short", day: "numeric" });
}
function sessionStarted(s) { return s.startedAt || s.runStartedAt; }
function sessionUpdated(s) { return s.endedAt || s.startedAt || s.runStartedAt; }
function fmtBytes(n) { return (n||0).toLocaleString(); }
function fmtTokens(t) {
  if (!t) return "0";
  if (t >= 1e6) return (t/1e6).toFixed(2) + "M";
  if (t >= 1e3) return (t/1e3).toFixed(1) + "k";
  return String(t);
}
function fmtCost(c) { return c ? "$" + c.toFixed(c < 1 ? 3 : 2) : "$0"; }
function totalTokens(t) {
  if (!t) return 0;
  return (t.input_tokens||0) + (t.output_tokens||0) + (t.cache_read_tokens||0) + (t.cache_creation_tokens||0);
}
function localDayKey(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return iso.slice(0,10);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function localMonthKey(iso) { return localDayKey(iso).slice(0,7); }
function localWeekKey(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = tmp.getUTCDay() || 7;
  tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil(((tmp - yearStart) / 86400000 + 1) / 7);
  return `${tmp.getUTCFullYear()}-W${pad2(weekNo)}`;
}
function monthLabel(key) {
  const d = new Date(key + "-01T00:00:00");
  if (isNaN(d)) return key;
  return d.toLocaleString(undefined, { month: "long", year: "numeric" });
}

// ---------- markdown ----------
function renderMarkdown(src) {
  if (!src) return "";
  const lines = String(src).split(/\r?\n/);
  const out = [];
  let i = 0, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const inline = (t) => {
    t = esc(t);
    t = t.replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
    t = t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  };
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flushPara();
      const lang = line.slice(3).trim();
      const body = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { body.push(lines[i]); i++; }
      i++;
      out.push('<pre><code' + (lang?' class="lang-'+esc(lang)+'"':'') + '>' + esc(body.join("\n")) + "</code></pre>");
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushPara(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) {
      flushPara(); const items = [];
      while (i < lines.length) {
        const m = lines[i].match(/^\s*[-*]\s+(.*)$/);
        if (!m) break; items.push("<li>" + inline(m[1]) + "</li>"); i++;
      }
      out.push("<ul>" + items.join("") + "</ul>"); continue;
    }
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) {
      flushPara(); const items = [];
      while (i < lines.length) {
        const m = lines[i].match(/^\s*\d+\.\s+(.*)$/);
        if (!m) break; items.push("<li>" + inline(m[1]) + "</li>"); i++;
      }
      out.push("<ol>" + items.join("") + "</ol>"); continue;
    }
    // GFM table: header row, separator row of `---`/`:---:`, then data rows.
    if (line.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-+:?(\s*\|\s*:?-+:?)+\s*\|?\s*$/.test(lines[i+1])) {
      const cells = (row) => {
        let r = row.trim();
        if (r.startsWith("|")) r = r.slice(1);
        if (r.endsWith("|") && !r.endsWith("\\|")) r = r.slice(0, -1);
        const out = []; let buf = "", inCode = false;
        for (let k = 0; k < r.length; k++) {
          const c = r[k];
          if (c === "\\" && r[k+1] === "|") { buf += "|"; k++; continue; }
          if (c === "`") { inCode = !inCode; buf += c; continue; }
          if (c === "|" && !inCode) { out.push(buf.trim()); buf = ""; continue; }
          buf += c;
        }
        out.push(buf.trim());
        return out;
      };
      const aligns = cells(lines[i+1]).map(c => {
        const l = c.startsWith(":"), r = c.endsWith(":");
        return r && l ? "center" : r ? "right" : l ? "left" : "";
      });
      const header = cells(line);
      const bodyRows = [];
      i += 2;
      while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
        bodyRows.push(cells(lines[i])); i++;
      }
      flushPara();
      const styleAttr = (j) => aligns[j] ? ` style="text-align:${aligns[j]}"` : "";
      const ths = header.map((h, j) => `<th${styleAttr(j)}>${inline(h)}</th>`).join("");
      const tbody = bodyRows.map(r =>
        "<tr>" + r.map((c, j) => `<td${styleAttr(j)}>${inline(c)}</td>`).join("") + "</tr>"
      ).join("");
      out.push(`<table class="md-table"><thead><tr>${ths}</tr></thead><tbody>${tbody}</tbody></table>`);
      continue;
    }
    if (line.trim() === "") { flushPara(); i++; continue; }
    para.push(line); i++;
  }
  flushPara();
  return out.join("\n");
}

// ---------- state ----------
const state = {
  sessions: [],
  searchResults: null,   // null = no active search
  filters: { search: "", branch: "", agent: "" },
  showInternals: false,
  statsRange: "all",     // "all" | "30d" | "7d"
  currentAgent: "claude", // agent of the open session ("claude" | "codex")
};

const AGENTS = ["claude", "codex"];
function agentLabel(a) { return a === "codex" ? "Codex" : "Claude"; }

// ---------- routing ----------
const contentEl = document.getElementById("content");
let lastRouteKey = "";
function route() {
  const key = location.pathname + location.search;
  if (key === lastRouteKey) return;
  lastRouteKey = key;
  const p = new URLSearchParams(location.search);
  const sPath = p.get("s");
  const view = p.get("view");
  if (sPath) {
    setActiveNav(null);
    renderSessionPage(sPath);
  } else if (view === "stats") {
    setActiveNav("stats");
    renderStatsPage();
  } else {
    setActiveNav("index");
    renderIndexPage();
  }
}
function setActiveNav(which) {
  document.getElementById("nav-index").classList.toggle("active", which === "index");
  document.getElementById("nav-stats").classList.toggle("active", which === "stats");
}
function navigate(query) {
  history.pushState(null, "", query || "?");
  window.scrollTo(0, 0);
  route();
}
window.addEventListener("popstate", route);
document.body.addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='?'], a.brand");
  if (!a) return;
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
  e.preventDefault();
  navigate(a.getAttribute("href"));
});

// ---------- index page ----------
function applyFilters(sessions) {
  const f = state.filters;
  const matches = state.searchResults ? new Map(state.searchResults.map(r => [r.path, r])) : null;
  return sessions.filter(s => {
    if (matches && !matches.has(s.path)) return false;
    if (f.branch && s.gitBranch !== f.branch) return false;
    if (!AGENTS.includes(s.tool)) return false;
    if (f.agent && s.tool !== f.agent) return false;
    return true;
  });
}

function renderIndexPage() {
  const f = state.filters;
  const branches = new Set();
  for (const s of state.sessions) {
    if (s.gitBranch) branches.add(s.gitBranch);
  }
  const opt = (set, current, allLabel) =>
    `<option value="">${allLabel}</option>` +
    [...set].sort().map(v => `<option value="${esc(v)}"${v===current?" selected":""}>${esc(v)}</option>`).join("");

  contentEl.innerHTML = `
    <div class="filters">
      <div class="search-wrap">
        <input id="f-search" placeholder="Search transcripts…" value="${esc(f.search)}">
        <button class="clear-search" id="f-search-clear" type="button" title="Clear search"
          style="${f.search ? "" : "display:none"}">×</button>
      </div>
      <select id="f-agent"><option value="">All agents</option>${
        AGENTS.map(a => `<option value="${a}"${a===f.agent?" selected":""}>${agentLabel(a)}</option>`).join("")
      }</select>
      <select id="f-branch">${opt(branches, f.branch, "All branches")}</select>
      <a class="reset-all" id="f-reset" href="#">Reset filters</a>
    </div>
    <div class="index-layout">
      <div id="sessions-area"></div>
      <aside class="month-jump"><div class="label">Jump to</div><div id="month-jump-list"></div></aside>
    </div>
  `;

  const search = document.getElementById("f-search");
  const clearBtn = document.getElementById("f-search-clear");
  let timer = null;
  const onSearchInput = () => {
    state.filters.search = search.value;
    clearBtn.style.display = search.value ? "" : "none";
    clearTimeout(timer);
    timer = setTimeout(runSearchAndRedraw, 250);
  };
  search.addEventListener("input", onSearchInput);
  clearBtn.addEventListener("click", () => {
    search.value = "";
    onSearchInput();
    search.focus();
  });

  document.getElementById("f-agent").addEventListener("change", (e) => {
    state.filters.agent = e.target.value;
    drawSessions();
  });

  document.getElementById("f-branch").addEventListener("change", (e) => {
    state.filters.branch = e.target.value;
    drawSessions();
  });

  document.getElementById("f-reset").addEventListener("click", (e) => {
    e.preventDefault();
    state.filters = { search: "", branch: "", agent: "" };
    state.searchResults = null;
    renderIndexPage();
  });

  drawSessions();
}

async function runSearchAndRedraw() {
  const q = state.filters.search.trim();
  if (q.length < 2) {
    state.searchResults = null;
    drawSessions();
    return;
  }
  const r = await fetch("/api/search?q=" + encodeURIComponent(q) + "&limit=300");
  const data = await r.json();
  state.searchResults = data.results;
  drawSessions();
}

function drawSessions() {
  const area = document.getElementById("sessions-area");
  const jump = document.getElementById("month-jump-list");
  if (!area) return;
  const sessions = applyFilters(state.sessions);
  if (!sessions.length) {
    area.innerHTML = `<div class="empty">No sessions match.</div>`;
    jump.innerHTML = "";
    return;
  }
  const matches = state.searchResults ? new Map(state.searchResults.map(r => [r.path, r])) : null;
  const dayGroups = new Map();
  for (const s of sessions) {
    const key = localDayKey(sessionUpdated(s));
    if (!dayGroups.has(key)) dayGroups.set(key, []);
    dayGroups.get(key).push(s);
  }
  const dayKeys = [...dayGroups.keys()].sort().reverse();
  const seenMonths = new Set();
  area.innerHTML = dayKeys.map(day => {
    const monthKey = day.slice(0, 7);
    const monthAttr = seenMonths.has(monthKey) ? "" : ` data-first-of-month="${monthKey}"`;
    seenMonths.add(monthKey);
    const rows = dayGroups.get(day).map(s => {
      const match = matches && matches.get(s.path);
      const href = "?s=" + encodeURIComponent(s.path);
      const title = s.name || s.firstPrompt || "(untitled)";
      const badge = `<span class="agent-badge agent-${esc(s.tool)}">${esc(agentLabel(s.tool))}</span> `;
      const started = sessionStarted(s), updated = sessionUpdated(s);
      const startTod = fmtTimeOfDay(started), updTod = fmtTimeOfDay(updated);
      // Grouped under the last-updated day, so spell out the start date when
      // the session began on an earlier day.
      const crossDay = localDayKey(started) !== localDayKey(updated);
      const startLabel = crossDay ? `${fmtShortDate(started)} ${startTod}` : startTod;
      const timeHtml = (updTod && (updTod !== startTod || crossDay))
        ? `${esc(startLabel)} <span class="arrow">→</span> ${esc(updTod)}`
        : esc(startTod);
      const timeTitle = `started ${fmtTime(started)} · last updated ${fmtTime(updated)}`;
      return `<a class="session-card ${esc(s.tool)}" href="${href}">
        <div class="row1">
          <div>${badge}<span class="name">${esc(title)}</span><span class="branch">${esc(s.gitBranch || "")}</span><span class="repo">${esc(s.repo || "")}</span></div>
          <div class="time" title="${esc(timeTitle)}">${timeHtml}</div>
        </div>
        ${s.name && s.firstPrompt ? `<div class="prompt">${esc(s.firstPrompt)}</div>` : ""}
        <div class="meta">
          <span>${s.messages} msgs</span>
          <span>${fmtTokens(totalTokens(s.tokens))} tok</span>
          <span>${fmtCost(s.cost)}</span>
        </div>
        ${match ? `<div class="match">${match.matchCount} match${match.matchCount===1?"":"es"}</div>` : ""}
      </a>`;
    }).join("");
    return `<section class="day-section" id="day-${day}"${monthAttr}>
      <h2>${esc(dayLabel(day))} · ${dayGroups.get(day).length}</h2>
      ${rows}
    </section>`;
  }).join("");
  const monthsToDays = new Map();
  for (const day of dayKeys) {
    const m = day.slice(0, 7);
    if (!monthsToDays.has(m)) monthsToDays.set(m, []);
    monthsToDays.get(m).push(day);
  }
  const monthEntries = [...monthsToDays.entries()];
  const latestMonth = monthEntries[0]?.[0];
  jump.innerHTML = monthEntries.map(([m, days]) => `
    <div class="month${m === latestMonth ? " open" : ""}" data-month="${m}">
      <button class="month-toggle" type="button">
        <span class="chev">▸</span>
        <span>${esc(monthLabel(m))}</span>
        <span class="count" style="margin-left:auto;color:var(--muted-2);font-size:12px">${days.length}</span>
      </button>
      <div class="days">
        ${days.map(d => `<a href="#day-${d}">${esc(dayJumpLabel(d))}</a>`).join("")}
      </div>
    </div>`).join("");
  jump.querySelectorAll(".month-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      btn.parentElement.classList.toggle("open");
    });
  });
}

function dayJumpLabel(key) {
  const d = new Date(key + "T00:00:00");
  if (isNaN(d)) return key;
  return d.toLocaleString(undefined, { weekday: "short", day: "numeric" });
}

function dayLabel(key) {
  const d = new Date(key + "T00:00:00");
  if (isNaN(d)) return key;
  return d.toLocaleString(undefined, { weekday: "short", month: "long", day: "numeric" });
}

// ---------- session page ----------
async function renderSessionPage(path) {
  const session = state.sessions.find(x => x.path === path);
  contentEl.innerHTML = `
    <a class="back" href="?">← All sessions</a>
    <div id="session-header"></div>
    <div id="transcript"><div class="empty">Loading…</div></div>
  `;
  renderSessionHeader(session, path);
  const r = await fetch("/api/session?path=" + encodeURIComponent(path));
  if (!r.ok) {
    document.getElementById("transcript").innerHTML = `<div class="empty">Failed to load session.</div>`;
    return;
  }
  const data = await r.json();
  state.currentEvents = data.events;
  state.currentAgent = data.agent || session?.tool || "claude";
  drawTranscript();
}

function renderSessionHeader(s, path) {
  const head = document.getElementById("session-header");
  if (!s) {
    head.innerHTML = `<div class="session-header"><div class="title"><div class="repo">unknown session</div></div></div>`;
    return;
  }
  const total = totalTokens(s.tokens);
  head.innerHTML = `
    <div class="session-header">
      <div class="title">
        <span class="agent-badge agent-${esc(s.tool)}">${esc(agentLabel(s.tool))}</span>
        <div class="repo">${esc(s.name || s.firstPrompt?.slice(0, 80) || "(untitled)")}</div>
        <div class="branch">${esc(s.gitBranch || "")} · ${esc(s.repo || "")}</div>
      </div>
      <div class="sid">
        <span class="label">id</span>
        <code>${esc(s.sessionId || "")}</code>
        <button class="copy" data-copy="${esc(s.sessionId || "")}">copy</button>
      </div>
      <div class="stats">
        <span title="started → last updated">${esc(fmtTime(s.startedAt))} → ${esc(fmtTime(s.endedAt))}</span>
        <span><b>${s.messages}</b> msgs</span>
        <span><b>${fmtTokens(total)}</b> tokens</span>
        <span><b>${fmtCost(s.cost)}</b></span>
        <span>${(s.models||[]).map(esc).join(", ")}</span>
      </div>
      <div class="stats-controls">
        <label class="toggle">
          <input type="checkbox" id="toggle-internals" ${state.showInternals?"checked":""}> show internals
        </label>
        <span class="actions">
          <button id="export-clean" title="Export user/assistant prose, no tool calls">Export clean</button>
          <button id="export-full" title="Export everything: thinking, tool calls, results">Export full</button>
          <button id="export-gist" title="Copy clean markdown and open gist.github.com in a new tab">→ Gist</button>
        </span>
      </div>
    </div>
  `;
  document.getElementById("toggle-internals").addEventListener("change", (e) => {
    state.showInternals = e.target.checked;
    drawTranscript();
  });
  document.getElementById("export-clean").addEventListener("click", () => {
    exportSession(s, state.currentEvents || [], "clean");
  });
  document.getElementById("export-full").addEventListener("click", () => {
    exportSession(s, state.currentEvents || [], "full");
  });
  document.getElementById("export-gist").addEventListener("click", (e) => {
    exportToGist(s, state.currentEvents || [], "clean", e.currentTarget);
  });
  head.querySelectorAll("button.copy").forEach(btn => {
    btn.addEventListener("click", async () => {
      const value = btn.dataset.copy;
      if (!value) return;
      try { await navigator.clipboard.writeText(value); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = value; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } finally { ta.remove(); }
      }
      const prev = btn.textContent; btn.textContent = "copied";
      setTimeout(() => { btn.textContent = prev; }, 1000);
    });
  });
}

const INTERNAL_TYPES = new Set([
  "system", "summary", "permission-mode", "skill_listing", "deferred_tools_delta",
  "task_reminder", "last-prompt", "file-history-snapshot", "edited_text_file",
  "attachment", "__parse_error",
]);

function drawTranscript() {
  const tEl = document.getElementById("transcript");
  if (!tEl) return;
  const events = state.currentEvents || [];
  const parts = [];
  let pending = [];
  const flush = () => {
    if (!pending.length) return;
    if (state.showInternals) {
      parts.push(`<details class="internal-block" open><summary>${pending.length} internal event${pending.length===1?"":"s"}</summary>` +
        pending.map(e => `<div class="internal"><span class="kind">${esc(e.type||"?")}</span>${esc(describeInternal(e))}</div>`).join("") +
        `</details>`);
    }
    pending = [];
  };
  for (const e of events) {
    const t = e.type;
    if (t === "user") { flush(); parts.push(renderUser(e)); }
    else if (t === "assistant") { flush(); parts.push(renderAssistant(e)); }
    else if (INTERNAL_TYPES.has(t)) { pending.push(e); }
    else { pending.push(e); }
  }
  flush();
  tEl.innerHTML = parts.join("\n") || `<div class="empty">Empty session.</div>`;
  hookClampButtons(tEl);
  hookCopyMarkdownButtons(tEl);
  // If the URL has a #evt-... hash, scroll to it now that the transcript exists.
  if (location.hash && location.hash.startsWith("#evt-")) {
    const target = document.getElementById(location.hash.slice(1));
    if (target) target.scrollIntoView({ block: "start" });
  }
}

function describeInternal(e) {
  if (e.type === "attachment") return e.attachment?.hookName || e.attachment?.type || "";
  if (e.type === "summary") return (e.summary || "").slice(0, 200);
  if (e.type === "permission-mode") return e.permissionMode || "";
  if (e.type === "edited_text_file") return e.filePath || "";
  if (e.type === "__parse_error") return "parse error";
  return "";
}

function renderUser(e) {
  const ts = fmtTimeOfDay(e.timestamp);
  const content = e.message?.content;
  const blocks = [];
  if (typeof content === "string") {
    blocks.push(`<div class="markdown">${renderMarkdown(content)}</div>`);
  } else if (Array.isArray(content)) {
    for (const b of content) {
      if (b.type === "text") {
        blocks.push(`<div class="markdown">${renderMarkdown(b.text || "")}</div>`);
      } else if (b.type === "tool_result") {
        blocks.push(renderToolResult(b));
      }
    }
  }
  // Tool results from a previous assistant turn arrive packaged as a "user" event but
  // visually they belong to the assistant flow — only render a User bubble when there
  // is real user-authored text content.
  const hasUserText = (typeof content === "string" && content.trim())
    || (Array.isArray(content) && content.some(b => b.type === "text" && b.text?.trim()));
  if (hasUserText) {
    const aid = e.uuid ? ` id="evt-${esc(e.uuid)}"` : "";
    const anchor = e.uuid ? `<a class="anchor first" href="#evt-${esc(e.uuid)}" title="Link to this message">#</a>` : "";
    const copy = e.uuid ? `<button class="copy-md" data-copy-uuid="${esc(e.uuid)}" title="Copy markdown" type="button">copy</button>` : "";
    return `<div class="evt user"${aid}><div class="who"><b>You</b><span class="ts">${esc(ts)}</span>${anchor}${copy}</div>
      <div class="body">${blocks.filter((_, i) => Array.isArray(content) ? content[i]?.type !== "tool_result" : true).join("")}</div></div>`;
  }
  return `<div class="evt assistant-aux"><div class="body">${blocks.join("")}</div></div>`;
}

function renderAssistant(e) {
  const ts = fmtTimeOfDay(e.timestamp);
  const msg = e.message || {};
  const model = msg.model || "";
  const blocks = [];
  for (const b of msg.content || []) {
    if (b.type === "text") {
      blocks.push(`<div class="markdown">${renderMarkdown(b.text || "")}</div>`);
    } else if (b.type === "thinking") {
      const text = (b.thinking || "").trim();
      if (text) blocks.push(`<div class="aux thinking">
        <div class="aux-label">thinking</div>
        ${clampWrap(`<div class="markdown">${renderMarkdown(text)}</div>`, text)}
      </div>`);
    } else if (b.type === "tool_use") {
      blocks.push(renderToolUse(b));
    }
  }
  const hasText = (msg.content || []).some(b => b.type === "text" && b.text?.trim());
  const aid = e.uuid ? ` id="evt-${esc(e.uuid)}"` : "";
  const anchor = e.uuid ? `<a class="anchor first" href="#evt-${esc(e.uuid)}" title="Link to this message">#</a>` : "";
  const copy = e.uuid && hasText ? `<button class="copy-md" data-copy-uuid="${esc(e.uuid)}" title="Copy markdown" type="button">copy</button>` : "";
  return `<div class="evt assistant"${aid}><div class="who"><b>${esc(agentLabel(state.currentAgent))}</b><span>${esc(model)}</span><span class="ts">${esc(ts)}</span>${anchor}${copy}</div>
    <div class="body">${blocks.join("")}</div></div>`;
}

function renderToolUse(b) {
  const input = JSON.stringify(b.input || {}, null, 2);
  return `<div class="aux tool-use">
    <div class="aux-label">→ <span class="name">${esc(b.name)}</span></div>
    ${clampWrap(`<pre><code>${esc(input)}</code></pre>`, input)}
  </div>`;
}

function renderToolResult(b) {
  let text = "";
  if (typeof b.content === "string") text = b.content;
  else if (Array.isArray(b.content)) text = b.content.map(x => x.text || "").join("\n");
  const cls = b.is_error ? "aux tool-result error" : "aux tool-result";
  return `<div class="${cls}">
    <div class="aux-label">← <span class="name">result${b.is_error?" (error)":""}</span></div>
    ${clampWrap(`<pre><code>${esc(text)}</code></pre>`, text)}
  </div>`;
}

const CLAMP_LINES = 60;
function clampWrap(html, rawText) {
  const lineCount = String(rawText || "").split(/\r?\n/).length;
  if (lineCount <= CLAMP_LINES) return html;
  return `<div class="clamp" data-lines="${lineCount}">
    <div class="clamped">${html}</div>
    <button class="show-all" type="button">Show all ${lineCount} lines</button>
  </div>`;
}

function hookClampButtons(root) {
  root.querySelectorAll(".clamp .show-all").forEach(btn => {
    btn.addEventListener("click", () => {
      btn.parentElement.classList.add("expanded");
      btn.remove();
    });
  });
}

function eventToMarkdown(e) {
  if (!e) return "";
  const content = e.message?.content;
  if (typeof content === "string") return content;
  if (!Array.isArray(content)) return "";
  const parts = [];
  for (const b of content) {
    if (b.type === "text" && b.text) parts.push(b.text);
  }
  return parts.join("\n\n");
}

function hookCopyMarkdownButtons(root) {
  const byUuid = new Map((state.currentEvents || []).map(e => [e.uuid, e]));
  root.querySelectorAll("button.copy-md").forEach(btn => {
    btn.addEventListener("click", async (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      const text = eventToMarkdown(byUuid.get(btn.dataset.copyUuid));
      if (!text) return;
      try { await navigator.clipboard.writeText(text); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } finally { ta.remove(); }
      }
      const prev = btn.textContent;
      btn.textContent = "copied";
      setTimeout(() => { btn.textContent = prev; }, 1000);
    });
  });
}

// ---------- export ----------
const META_PREFIXES = [
  "<command-name>", "<command-message>", "<command-args>",
  "<command-stdout>", "<command-stderr>",
  "<local-command-stdout>", "<local-command-stderr>", "<local-command-caveat>",
  "<bash-input>", "<bash-stdout>", "<bash-stderr>",
  "<system-reminder>", "<user-prompt-submit-hook>",
  "Caveat: The messages below were generated by the user",
];
function isMetaUserText(text) {
  if (!text) return true;
  const s = text.replace(/^\s+/, "");
  return META_PREFIXES.some(p => s.startsWith(p));
}

function userTextOf(content) {
  if (typeof content === "string") return content;
  if (!Array.isArray(content)) return "";
  const parts = [];
  for (const b of content) if (b.type === "text" && b.text) parts.push(b.text);
  return parts.join("\n\n");
}

function toolResultText(b) {
  if (typeof b.content === "string") return b.content;
  if (Array.isArray(b.content)) return b.content.map(x => x.text || "").join("\n");
  return "";
}

function fenced(text, lang) {
  // Pick a fence longer than any run of backticks inside the body so we never collide.
  let fence = "```";
  const m = String(text || "").match(/`{3,}/g);
  if (m) {
    const longest = Math.max(...m.map(s => s.length));
    fence = "`".repeat(longest + 1);
  }
  return fence + (lang || "") + "\n" + (text || "") + "\n" + fence;
}

function buildSessionMarkdown(s, events, mode) {
  const out = [];
  const title = s?.name || s?.firstPrompt?.slice(0, 80) || "(untitled)";
  out.push(`# ${title}`, "");
  if (s) {
    if (s.repo) out.push(`- **repo**: ${s.repo}`);
    if (s.gitBranch) out.push(`- **branch**: ${s.gitBranch}`);
    if (s.startedAt) out.push(`- **started**: ${fmtTime(s.startedAt)}`);
    if (s.endedAt) out.push(`- **ended**: ${fmtTime(s.endedAt)}`);
    if (s.sessionId) out.push(`- **session id**: \`${s.sessionId}\``);
    if (s.models?.length) out.push(`- **models**: ${s.models.join(", ")}`);
    out.push(`- **messages**: ${s.messages} · **tokens**: ${fmtTokens(totalTokens(s.tokens))} · **cost**: ${fmtCost(s.cost || 0)}`);
    out.push("", "---", "");
  }
  for (const e of events) {
    if (e.type === "user") {
      const content = e.message?.content;
      const text = userTextOf(content).trim();
      const showText = text && !isMetaUserText(text);
      if (showText) {
        out.push(`## You — ${fmtTime(e.timestamp)}`, "", text, "");
      } else if (mode === "full" && text) {
        // Surface meta wrappers (slash commands, caveats) in full export only.
        out.push(`## You — ${fmtTime(e.timestamp)}`, "", fenced(text), "");
      }
      if (mode === "full" && Array.isArray(content)) {
        for (const b of content) {
          if (b.type === "tool_result") {
            const body = toolResultText(b);
            out.push(`### ← tool_result${b.is_error ? " (error)" : ""}`, "", fenced(body), "");
          }
        }
      }
    } else if (e.type === "assistant") {
      const blocks = e.message?.content || [];
      const interesting = blocks.some(b =>
        (b.type === "text" && b.text?.trim()) ||
        (mode === "full" && b.type === "thinking" && b.thinking?.trim()) ||
        (mode === "full" && b.type === "tool_use")
      );
      if (!interesting) continue;
      const model = e.message?.model ? ` (${e.message.model})` : "";
      out.push(`## ${agentLabel(state.currentAgent)}${model} — ${fmtTime(e.timestamp)}`, "");
      for (const b of blocks) {
        if (b.type === "text" && b.text?.trim()) {
          out.push(b.text.trim(), "");
        } else if (b.type === "thinking" && mode === "full") {
          const t = (b.thinking || "").trim();
          if (t) {
            out.push(`### thinking`, "");
            out.push(t.split("\n").map(l => "> " + l).join("\n"), "");
          }
        } else if (b.type === "tool_use" && mode === "full") {
          const input = JSON.stringify(b.input || {}, null, 2);
          out.push(`### → ${b.name}`, "", fenced(input, "json"), "");
        }
      }
    }
  }
  return out.join("\n");
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } finally { ta.remove(); }
    return ok;
  }
}

function exportToGist(s, events, mode, btn) {
  // Open via a synthetic anchor click so the new tab counts as user-initiated
  // navigation rather than a window.open popup (which Chrome reports as null
  // when noopener is set, making success indistinguishable from a block).
  const a = document.createElement("a");
  a.href = "https://gist.github.com/";
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  document.body.appendChild(a);
  a.click();
  a.remove();
  const md = buildSessionMarkdown(s, events, mode);
  copyToClipboard(md).then(ok => {
    if (!btn) return;
    const prev = btn.textContent;
    btn.textContent = ok ? "copied — paste in gist tab" : "copy failed";
    setTimeout(() => { btn.textContent = prev; }, 1800);
  });
}

function exportSession(s, events, mode) {
  const md = buildSessionMarkdown(s, events, mode);
  const datePart = (s?.startedAt || s?.runStartedAt || "").slice(0, 10) || "session";
  const slug = (s?.name || s?.firstPrompt || "session")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50) || "session";
  const filename = `${state.currentAgent}-${datePart}-${slug}-${mode}.md`;
  const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------- stats chart ----------
const CHART_PALETTE = [
  "#4e73c4", // blue
  "#2e8b57", // green
  "#b58a2e", // gold
  "#c96442", // accent coral
  "#7e549f", // purple
  "#2c8089", // teal
  "#b54b75", // rose
  "#8a6e3a", // brown
];

function fmtTokensAxis(t) {
  if (!t) return "0";
  const trim = (n) => {
    const s = n.toFixed(1);
    return s.endsWith(".0") ? s.slice(0, -2) : s;
  };
  if (t >= 1e9) return trim(t/1e9) + "B";
  if (t >= 1e6) return trim(t/1e6) + "M";
  if (t >= 1e3) return trim(t/1e3) + "k";
  return String(Math.round(t));
}

function modelLabel(m) {
  if (!m) return "(unknown)";
  if (m === "<synthetic>") return "synthetic";
  // claude-opus-4-7-20251101 → "Opus 4.7"; claude-haiku-3-5 → "Haiku 3.5"
  const match = m.match(/claude-(opus|sonnet|haiku)-(\d+)(?:-(\d+))?/i);
  if (match) {
    const family = match[1][0].toUpperCase() + match[1].slice(1);
    const ver = match[3] ? `${match[2]}.${match[3]}` : match[2];
    return `${family} ${ver}`;
  }
  // gpt-5.5 → "GPT-5.5", gpt-5-mini → "GPT-5 mini"
  if (/^gpt-/i.test(m)) return m.replace(/^gpt-/i, "GPT-").replace(/-(mini|nano|codex)/i, " $1");
  return m;
}

function pad2DateKey(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

function buildTokenChartData(sessions, range) {
  // Filter to priced agent sessions (Claude + Codex) with valid timestamps.
  const rows = sessions.filter(s => AGENTS.includes(s.tool) && (s.startedAt || s.runStartedAt));
  if (!rows.length) return null;

  // Range start/end (inclusive day keys).
  let startKey, endKey;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if (range === "7d" || range === "30d") {
    const span = range === "7d" ? 6 : 29;
    const startDate = new Date(today); startDate.setDate(today.getDate() - span);
    startKey = pad2DateKey(startDate);
    endKey = pad2DateKey(today);
  } else {
    const allKeys = rows.map(s => localDayKey(s.startedAt || s.runStartedAt)).filter(Boolean).sort();
    startKey = allKeys[0];
    endKey = allKeys[allKeys.length - 1];
  }
  if (!startKey || !endKey) return null;

  // Build the day axis between startKey and endKey, inclusive.
  const days = [];
  const cursor = new Date(startKey + "T00:00:00");
  const stop = new Date(endKey + "T00:00:00");
  while (cursor <= stop) { days.push(pad2DateKey(cursor)); cursor.setDate(cursor.getDate() + 1); }

  // Walk sessions in range, sum per-model tokens per day, and compute totals.
  const dayIndex = new Map(days.map((d, i) => [d, i]));
  const perModelSeries = new Map();   // model → [tokens per day]
  const perModelTotals = new Map();   // model → { in, out, cacheRead, cacheCreate, total, cost }
  let grandTotalTokens = 0;
  for (const s of rows) {
    const key = localDayKey(s.startedAt || s.runStartedAt);
    const idx = dayIndex.get(key);
    if (idx === undefined) continue;
    const tbm = s.tokensByModel || {};
    const cbm = s.costByModel || {};
    for (const [m, tok] of Object.entries(tbm)) {
      const n = (tok.input_tokens||0) + (tok.output_tokens||0)
              + (tok.cache_read_tokens||0) + (tok.cache_creation_tokens||0);
      if (!perModelSeries.has(m)) perModelSeries.set(m, new Array(days.length).fill(0));
      perModelSeries.get(m)[idx] += n;
      const t = perModelTotals.get(m) || { in: 0, out: 0, cacheRead: 0, cacheCreate: 0, total: 0, cost: 0 };
      t.in += tok.input_tokens || 0;
      t.out += tok.output_tokens || 0;
      t.cacheRead += tok.cache_read_tokens || 0;
      t.cacheCreate += tok.cache_creation_tokens || 0;
      t.total += n;
      t.cost += cbm[m] || 0;
      perModelTotals.set(m, t);
      grandTotalTokens += n;
    }
  }
  if (!perModelSeries.size) return null;

  // Sort models by total tokens desc — drives both line color order and legend order.
  const models = [...perModelSeries.keys()].sort((a, b) =>
    (perModelTotals.get(b)?.total || 0) - (perModelTotals.get(a)?.total || 0));

  return { days, models, perModelSeries, perModelTotals, grandTotalTokens, range };
}

function renderTokenChart(data) {
  if (!data) return `<div class="empty" style="padding:30px">No token data in this range.</div>`;
  const { days, models, perModelSeries } = data;

  const W = 880, H = 280;
  const padL = 56, padR = 16, padT = 12, padB = 28;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  // Y scale — round the max up to a nice tick.
  let maxY = 0;
  for (let i = 0; i < days.length; i++) {
    let stack = 0;
    for (const m of models) stack += perModelSeries.get(m)[i] || 0;
    if (stack > maxY) maxY = stack;
  }
  if (maxY <= 0) maxY = 1;
  const niceMax = (() => {
    const exp = Math.floor(Math.log10(maxY));
    const base = Math.pow(10, exp);
    const norm = maxY / base;
    const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return step * base;
  })();
  const yTicks = 5;
  const yVals = [];
  for (let i = 0; i <= yTicks; i++) yVals.push(niceMax * i / yTicks);

  const slotW = innerW / days.length;
  const barW = Math.max(1.2, slotW * 0.78);
  const xAt = (i) => padL + (i + 0.5) * slotW;
  const yAt = (v) => padT + (1 - v / niceMax) * innerH;

  // Y grid + labels.
  let svg = "";
  for (const v of yVals) {
    const y = yAt(v);
    svg += `<line class="chart-grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
    svg += `<text class="chart-axis" x="${padL - 6}" y="${y + 3}" text-anchor="end">${esc(fmtTokensAxis(v))}</text>`;
  }
  // Baseline.
  svg += `<line class="chart-baseline" x1="${padL}" x2="${W - padR}" y1="${yAt(0)}" y2="${yAt(0)}"/>`;

  // X axis labels — pick a handful of evenly spaced ticks.
  const targetTicks = data.range === "7d" ? days.length : Math.min(6, days.length);
  const tickIdxs = [];
  if (targetTicks <= 1) tickIdxs.push(0);
  else for (let i = 0; i < targetTicks; i++) {
    tickIdxs.push(Math.round(i * (days.length - 1) / (targetTicks - 1)));
  }
  for (const idx of tickIdxs) {
    const d = new Date(days[idx] + "T00:00:00");
    const label = data.range === "7d"
      ? d.toLocaleString(undefined, { weekday: "short", day: "numeric" })
      : d.toLocaleString(undefined, { month: "short", day: "numeric" });
    svg += `<text class="chart-axis" x="${xAt(idx)}" y="${H - 8}" text-anchor="middle">${esc(label)}</text>`;
  }

  // Stacked bars — largest model on bottom (matches the legend order).
  const baseline = yAt(0);
  for (let i = 0; i < days.length; i++) {
    let yCursor = baseline;
    const xLeft = xAt(i) - barW / 2;
    for (const m of models) {
      const v = perModelSeries.get(m)[i] || 0;
      if (v <= 0) continue;
      const h = (v / niceMax) * innerH;
      yCursor -= h;
      const color = CHART_PALETTE[models.indexOf(m) % CHART_PALETTE.length];
      svg += `<rect class="chart-bar" x="${xLeft.toFixed(2)}" y="${yCursor.toFixed(2)}" width="${barW.toFixed(2)}" height="${h.toFixed(2)}" fill="${color}"/>`;
    }
  }
  // Transparent hit areas — full-height columns spanning the slot, drawn last so they
  // sit above the bars and capture pointer events anywhere in the column.
  for (let i = 0; i < days.length; i++) {
    const x = padL + i * slotW;
    svg += `<rect class="chart-hit" data-day="${i}" x="${x.toFixed(2)}" y="${padT}" width="${slotW.toFixed(2)}" height="${innerH}"/>`;
  }

  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Tokens per day per model">${svg}</svg>
    <div class="chart-tooltip" id="chart-tooltip" aria-hidden="true"></div>
  </div>`;
}

function buildTooltipHTML(data, idx) {
  const day = data.days[idx];
  const d = new Date(day + "T00:00:00");
  const date = d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  const rows = [];
  let total = 0;
  for (const m of data.models) {
    const v = data.perModelSeries.get(m)[idx] || 0;
    if (v <= 0) continue;
    total += v;
    const color = CHART_PALETTE[data.models.indexOf(m) % CHART_PALETTE.length];
    rows.push(`<div class="tt-row">
      <span class="label"><span class="swatch" style="background:${color}"></span>${esc(modelLabel(m))}</span>
      <span class="val">${esc(fmtTokens(v))}</span>
    </div>`);
  }
  if (!rows.length) {
    return `<div class="tt-date">${esc(date)}</div><div class="tt-empty">no activity</div>`;
  }
  return `<div class="tt-date">${esc(date)}</div>${rows.join("")}
    <div class="tt-total"><b>Total</b><b>${esc(fmtTokens(total))}</b></div>`;
}

function hookChartHover(root, data) {
  const wrap = root.querySelector(".chart-wrap");
  if (!wrap || !data) return;
  const tooltip = wrap.querySelector(".chart-tooltip");
  const hits = wrap.querySelectorAll(".chart-hit");
  let activeHit = null;
  const place = (clientX, clientY) => {
    const r = wrap.getBoundingClientRect();
    const x = clientX - r.left;
    const y = clientY - r.top;
    const tw = tooltip.offsetWidth;
    const th = tooltip.offsetHeight;
    const offset = 12;
    const left = (x + offset + tw > r.width) ? Math.max(0, x - tw - offset) : x + offset;
    const top = Math.max(0, Math.min(r.height - th, y - th / 2));
    tooltip.style.left = left + "px";
    tooltip.style.top = top + "px";
  };
  hits.forEach(hit => {
    hit.addEventListener("mouseenter", (e) => {
      if (activeHit) activeHit.classList.remove("active");
      activeHit = hit;
      hit.classList.add("active");
      tooltip.innerHTML = buildTooltipHTML(data, parseInt(hit.dataset.day, 10));
      tooltip.classList.add("visible");
      place(e.clientX, e.clientY);
    });
    hit.addEventListener("mousemove", (e) => place(e.clientX, e.clientY));
  });
  wrap.addEventListener("mouseleave", () => {
    if (activeHit) activeHit.classList.remove("active");
    activeHit = null;
    tooltip.classList.remove("visible");
  });
}

function renderModelLegend(data, limit = 8) {
  if (!data) return "";
  const total = data.grandTotalTokens || 1;
  const items = data.models.slice(0, limit).map(m => {
    const t = data.perModelTotals.get(m);
    const color = CHART_PALETTE[data.models.indexOf(m) % CHART_PALETTE.length];
    const pct = (100 * t.total / total).toFixed(1);
    return `<div class="legend-item">
      <div class="head"><span class="swatch" style="background:${color}"></span>
        <span>${esc(modelLabel(m))}</span>
        <span class="pct">${pct}%</span></div>
      <div class="nums">In: ${esc(fmtTokens(t.in))} · Out: ${esc(fmtTokens(t.out))}
        · Cache: ${esc(fmtTokens(t.cacheRead + t.cacheCreate))} · ${esc(fmtCost(t.cost))}</div>
    </div>`;
  }).join("");
  const extra = data.models.length > limit
    ? `<div class="legend-item" style="color:var(--muted-2);font-size:12px;align-self:center">+${data.models.length - limit} more model${data.models.length - limit === 1 ? "" : "s"}</div>`
    : "";
  return `<div class="legend-row">${items}${extra}</div>`;
}

function renderTokenChartBlock() {
  const range = state.statsRange;
  const data = buildTokenChartData(state.sessions, range);
  const tab = (key, label) =>
    `<button data-range="${key}" class="${range===key?"active":""}">${label}</button>`;
  return {
    html: `<div class="stats-chart" id="stats-chart">
      <div class="stats-chart-head">
        <h2>Tokens per day</h2>
        <div class="range-tabs">
          ${tab("all","All time")}
          ${tab("30d","Last 30 days")}
          ${tab("7d","Last 7 days")}
        </div>
      </div>
      ${renderTokenChart(data)}
      ${renderModelLegend(data)}
    </div>`,
    data,
  };
}

function hookRangeTabs(root) {
  root.querySelectorAll(".range-tabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      state.statsRange = btn.dataset.range;
      const target = document.getElementById("stats-chart");
      if (!target) return;
      const block = renderTokenChartBlock();
      const tmp = document.createElement("div");
      tmp.innerHTML = block.html;
      const fresh = tmp.firstElementChild;
      target.replaceWith(fresh);
      hookRangeTabs(fresh.parentElement);
      hookChartHover(fresh, block.data);
    });
  });
}

// ---------- stats page ----------
function renderStatsPage() {
  const ss = state.sessions;
  let totals = { sessions: 0, events: 0, tokens: 0, cost: 0 };
  const byDay = {}, byWeek = {}, byMonth = {}, byRepo = {}, byModel = {};
  const bump = (bucket, key, label, t, cost) => {
    bucket[key] = bucket[key] || { [label]: key, sessions: 0, tokens: 0, cost: 0 };
    bucket[key].sessions += 1; bucket[key].tokens += t; bucket[key].cost += cost;
  };
  for (const s of ss) {
    if (!AGENTS.includes(s.tool)) continue;
    totals.sessions += 1; totals.events += s.events || 0;
    const t = totalTokens(s.tokens); totals.tokens += t;
    const cost = s.cost || 0; totals.cost += cost;
    const iso = s.startedAt || s.runStartedAt;
    bump(byDay,   localDayKey(iso),   "day",   t, cost);
    bump(byWeek,  localWeekKey(iso),  "week",  t, cost);
    bump(byMonth, localMonthKey(iso), "month", t, cost);
    bump(byRepo,  s.repo || "(none)", "repo",  t, cost);
    for (const m of s.models || []) bump(byModel, m, "model", t, cost);
  }
  const table = (rows, cols) =>
    `<table class="stats-table"><thead><tr>${cols.map(c => `<th class="${c.num?"num":""}">${c.label}</th>`).join("")}</tr></thead>
     <tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.num?"num":""}">${c.fmt ? c.fmt(r[c.key]) : esc(r[c.key] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  const sortDesc = (key) => (a, b) => String(b[key] ?? "").localeCompare(String(a[key] ?? ""));
  const sortByCost = (a, b) => b.cost - a.cost;
  const cols = (k) => [
    { key: k, label: k[0].toUpperCase()+k.slice(1) },
    { key: "sessions", label: "Sessions", num: true, fmt: fmtBytes },
    { key: "tokens", label: "Tokens", num: true, fmt: fmtTokens },
    { key: "cost", label: "Cost", num: true, fmt: fmtCost },
  ];
  const chartBlock = renderTokenChartBlock();
  contentEl.innerHTML = `
    <div class="stats">
      <div class="stats-totals">
        <b>${totals.sessions}</b> sessions · <b>${fmtBytes(totals.events)}</b> events ·
        <b>${fmtTokens(totals.tokens)}</b> tokens · <b>${fmtCost(totals.cost)}</b>
      </div>
      ${chartBlock.html}
      <div class="stats-nav">
        Jump to:
        <a href="#stats-month">month</a>
        <a href="#stats-week">week</a>
        <a href="#stats-day">day</a>
        <a href="#stats-repo">repo</a>
        <a href="#stats-model">model</a>
      </div>
      <h2 id="stats-month">By month</h2> ${table(Object.values(byMonth).sort(sortDesc("month")), cols("month"))}
      <h2 id="stats-week">By week</h2>   ${table(Object.values(byWeek).sort(sortDesc("week")),   cols("week"))}
      <h2 id="stats-day">By day</h2>     ${table(Object.values(byDay).sort(sortDesc("day")),     cols("day"))}
      <h2 id="stats-repo">By repo</h2>   ${table(Object.values(byRepo).sort(sortByCost),         cols("repo"))}
      <h2 id="stats-model">By model</h2> ${table(Object.values(byModel).sort(sortByCost),        cols("model"))}
    </div>
  `;
  hookRangeTabs(contentEl);
  hookChartHover(contentEl, chartBlock.data);
}

// ---------- theme toggle ----------
function setupThemeToggle() {
  const btn = document.getElementById("theme-toggle");
  if (!btn) return;
  const sync = () => {
    const dark = document.documentElement.dataset.theme === "dark";
    btn.textContent = dark ? "☀" : "☾";
    btn.title = dark ? "Switch to light mode" : "Switch to dark mode";
  };
  btn.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
    sync();
  });
  sync();
}
setupThemeToggle();

// ---------- bootstrap ----------
async function bootstrap() {
  const r = await fetch("/api/sessions");
  state.sessions = await r.json();
  route();
}
bootstrap().catch(err => {
  contentEl.innerHTML = `<div class="empty">Failed to load: ${esc(err.message)}</div>`;
});
</script>
